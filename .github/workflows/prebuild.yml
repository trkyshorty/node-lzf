name: prebuild

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# En az yetki: iş yalnızca depoyu okur ve artifact yükler; jetonun yazma yetkisi gerekmez.
permissions:
  contents: read

jobs:
  prebuild:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: ubuntu-24.04-arm
            name: linux-arm64
          - os: windows-latest
            name: win32-x64
          - os: macos-14
            name: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - run: npm run prebuild
      - run: npm test
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilds-${{ matrix.name }}
          path: prebuilds/
          if-no-files-found: error

  merge:
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      # v8: özet (digest) uyuşmazlığında varsayılan olarak hata verir; pattern + merge-multiple
      # davranışı v4 ile aynıdır.
      - uses: actions/download-artifact@v8
        with:
          path: prebuilds
          pattern: prebuilds-*
          merge-multiple: true
      - uses: actions/upload-artifact@v7
        with:
          name: prebuilds
          path: prebuilds/
          if-no-files-found: error
