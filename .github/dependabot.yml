version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # All action updates are grouped into a single PR.
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Minor and patch updates are grouped into a single PR; major versions get their own PRs.
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
